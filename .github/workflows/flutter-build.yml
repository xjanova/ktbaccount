name: Flutter Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true
      - name: Get Version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Update Flutter Version
        working-directory: flutter_app
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Update version in pubspec.yaml
          sed -i "s/^version: .*/version: $VERSION+$(echo $VERSION | tr -d '.')/" pubspec.yaml
      - name: Get Dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          cp flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/ktbaccount-$VERSION-arm64.apk
          cp flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/ktbaccount-$VERSION-arm.apk
          cp flutter_app/build/app/outputs/flutter-apk/app-x86_64-release.apk release/ktbaccount-$VERSION-x86_64.apk
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" release/*.apk --clobber
      - name: Upload Artifact (non-tag)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/*.apk
